  url: http://arxiv.org/abs/2609.16925v1
  source: arXiv
  date: '2026.09'
  abstract: Hyperbolic geometry provides a natural inductive bias for genomic representation learning, but existing hyperbolic
    genomic models primarily use Lorentz convolutions to learn local sequence representations, while their residual pathways
    do not directly aggregate full Lorentz representations. We propose HyCoSeq, a contextual hyperbolic representation learning
    framework for genomic sequences. HyCoSeq incorporates weighted Lorentzian residual aggregation into multi-curvature Lorentz
    encoding, allowing full Lorentz representations to participate directly in geometry-consistent local aggregation. It further
    introduces a bidirectional long short-term memory network that integrates information from both sequence directions to
