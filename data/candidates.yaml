    local hyperbolic convolutional encoding to sequence-level contextualized representations. Extensive experiments across
    diverse genomic tasks show that HyCoSeq outperforms existing hyperbolic baselines and, without large-scale genomic pretraining,
    achieves competitive performance against substantially larger pretrained DNA language models.
