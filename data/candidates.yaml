  abstract: The genome holds the blueprint that governs the biological properties of the cell. Consequently, advancing our
    knowledge of genomic function is crucial both for a broader understanding of biology and for continued biomedical advances.
    The success of large language models on natural language and protein sequences has motivated similar efforts on genomic
    data. However, standard genomic language models (gLMs) often require extremely large computational resources and still
    fall behind traditional methods on some downstream tasks. Recently, MSA-based pretraining has been proposed as an efficient
    alternative, but existing models are limited to short input contexts, restricting their use to short-range tasks, such
    as variant effect prediction. In this work, we present RAGenome, the first retrieval-based gLM that scales pretraining
    to longer contexts (100$\times$ longer than existing MSA-based gLMs), allowing it to capture both across-species evolutionary
    relationships and within-species longer-range interactions. Trained on whole-genome alignments from 100 vertebrates, RAGenome
    substantially improves the long-range capabilities of MSA-based gLMs, raising gene finding performance from 0.45 to 0.60,
    while remaining competitive on purely evolutionary-based tasks like prioritizing pathogenic variants. RAGenome provides
    competitive gLM performance at a fraction of the training cost, unifying evolutionary modeling and long-range capabilities
    within a single, flexible, scalable framework. Code is available at https://github.com/PanosAntoniadis/RAGenome.
