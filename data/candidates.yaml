  abstract: 'In shared-genome language-model societies, restricted evidence visibility favors reusable, value-indexed latent
    packet interfaces, whereas the sole high-performing globally visible model in the parent study learned an episode-entangled
    code. This companion study asks whether independently trained societies share one packet language, where strict zero-shot
    transfer fails, and whether inherited interface state helps or harms later learning. First, a leakage-controlled causal
    interoperability audit over all 30 ordered pairs of six independently trained restricted societies -- under sealed held-out
    structure and a preregistered raw/orthogonal/linear/nonlinear alignment ladder -- shows the six semantically similar interfaces
    do not form one raw language: one same-initialization pair is exactly interoperable in both directions, a second shows
    asymmetric partial compatibility, and all 26 cross-initialization directions fail every frozen alignment rung. Second,
    within the tested decomposition and a single sealed source formulation, a source-span control localizes strict zero-shot
    failure to interpretation and execution of the new operator instructions. Third, in a matched adaptation factorial, the
    globally trained communication interface acts as a severe negative-transfer prior: reinitializing only the packet reader,
    writer, and mouth raises final depth-three accuracy from 0.169 to 0.857. Fourth, across two restricted checkpoints and
    two independently frozen target streams each, inherited interfaces never exceeded fresh-interface controls by the preregistered
    0.10 margin. All primary conclusions are bounded to a near-transfer 17-state setting; the negative-transfer factorial
