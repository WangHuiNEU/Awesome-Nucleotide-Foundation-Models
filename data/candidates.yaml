- name: VANDAM
  title: 'VANDAM: Viewing a nucleotide sequence with DNA molecular priors'
  url: http://arxiv.org/abs/2610.00411v1
  source: arXiv
  date: '2026.09'
  abstract: Contemporary Genomic Foundation Models (GFMs) rely on a DNA-as-a-string paradigm that employs masked token prediction
    objectives for pretraining. However, this abstraction does not explicitly model the biochemical, structural, and physical
    properties essential to biological function. Many molecular properties can be estimated from sequence using established
    biophysical models, so their utility lies not in providing an independent modality, but in introducing priors that training
    objectives can explicitly exploit. We introduce VANDAM, a framework that extends the training of GFMs with DNA molecular
    priors. In self-supervised training, VANDAM predicts regional molecular properties from pooled representations. When functional
    labels are available and can reward retaining molecular priors, local features are additionally injected at the input.
    VANDAM consistently improves downstream performance across four architecture families and nine held-out genomic tasks
    by complementing token-based objectives. Probing experiments further demonstrate that the use of molecular priors generalizes
    to other unseen molecular properties.
