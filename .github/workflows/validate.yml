name: Validate catalog

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate structured metadata
        run: python scripts/validate_data.py

      - name: Regenerate README and visualizations
        run: python generate_paper_list.py

      - name: Check generated artifacts are committed
        run: |
          if [ -n "$(git status --porcelain README.md assets/model_timeline.svg assets/model_evolution_tree.svg)" ]; then
            git status --short README.md assets/model_timeline.svg assets/model_evolution_tree.svg
            git diff -- README.md assets/model_timeline.svg assets/model_evolution_tree.svg
            exit 1
          fi

      - name: Compile maintenance scripts
        run: python -m compileall -q generate_paper_list.py scripts
